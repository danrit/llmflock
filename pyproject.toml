[project]
name = "llmflock"
version = "0.0.4"
description = "LLM FLock is a CLI tool to interact with local and remote LLM, define multiple scenario variations (model × prompt × options), run them over a dataset and capture structured results for comparison or to build knowledge through meta analysis."
readme = "README.md"
authors = [
    { name = "Gabriel Damour" },
]
license = "Apache-2.0"
dependencies = [
    "jsonschema",
    "llm",
    "llm-gpt4all",
    "llm-ollama",
    "ollama",
    "python-dotenv",
    "PyYAML"
]

[project.urls]
Homepage = "https://github.com/danrit/llmflock"
#Documentation = "https://readthedocs.org"
#Repository = "https://github.com/me/spam.git"
Issues = "https://github.com/danrit/llmflock/issues"
#Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

[project.scripts]
llmflock = "llmflock.cli:cli"

# Required to build the package since we are not using src layout
# IE setuptools would misinterpret extra folder(s) (data) as a package if we
# don't add this ("Multiple top-level packages discovered in a flat-layout")
[tool.setuptools]
packages = ["llmflock"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


# General note: Written using a mix of python packaging user guides,
# simonw/llm approach and various sources from Google
# https://packaging.python.org/en/latest/, specifically:
# - https://packaging.python.org/en/latest/guides/creating-command-line-tools/
# - https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# - https://packaging.python.org/en/latest/discussions/src-layout-vs-flat-layout/