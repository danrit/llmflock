#
datasets:
  default: &datasets_default
    filename: data/example2-img-transform/dataset.jsonl
  default_lite: &datasets_default_lite
    filename: data/example2-img-transform/dataset.lite.jsonl

data_schemas:
  default: &data_schemas_default
    # Definition of the expected structured data format (JSON Schema)
    type: object
    properties:
      cloudflare_url_component:
        type:
          - string
          - "null"
    required:
      - cloudflare_url_component

prompts:
  default: &prompts_default
    name: default
    template:
      filename: data/example2-img-transform/PROMPT.default.md
      variables: # unused...
        - const_embed_text_doc_cloudinary
        - const_embed_text_doc_cloudflare
        - cloudinary_url_component

prompt_const_embeds:
  default: &prompt_const_embeds_default
    name: default
    variables:
      const_embed_text_doc_cloudinary:
        filename: data/example2-img-transform/documents/cloudinary.md
      const_embed_text_doc_cloudflare:
        filename: data/example2-img-transform/documents/cloudflare.md
  default_lite: &prompt_const_embeds_default_lite
    name: default_lite
    variables:
      const_embed_text_doc_cloudinary:
        filename: data/example2-img-transform/documents/cloudinary.lite.md
      const_embed_text_doc_cloudflare:
        filename: data/example2-img-transform/documents/cloudflare.lite.md
  unprocessed: &prompt_const_embeds_unprocessed
    name: unprocessed
    variables:
      const_embed_text_doc_cloudinary:
        filename: data/example2-img-transform/documents/cloudinary.bycloudinary.md
      const_embed_text_doc_cloudflare:
        filename: data/example2-img-transform/documents/cloudflare.bycloudflare.md

models:
  deepseek-r1:
    backend: ollama_ollama
    name: deepseek-r1:8b-llama-distill-q4_K_M
    options:
      temperature: temperature
      max_predict_tokens: num_predict
      top_p: top_p
  gemma3:
    backend: ollama_ollama
    options:
      temperature: temperature
      max_predict_tokens: num_predict
      top_p: top_p
  gpt-oss:
    backend: ollama_ollama
    name: gpt-oss
    options:
      temperature: temperature
      max_predict_tokens: num_predict
      top_p: top_p

scenarios:
  default:
    name: Migration of url-based image transformations from Service A to Service B (Cloudinary to Cloudflare)
    dataset: *datasets_default_lite
    data_schema: *data_schemas_default
    variations:
      prompts:
        - *prompts_default
      prompt_const_embeds:
#        - *prompt_const_embeds_default
        - *prompt_const_embeds_default_lite
#        - *prompt_const_embeds_unprocessed
      models:
#        - deepseek-r1
        - gemma3
#        - gpt-oss
      model_options:
        temperature:
          - 0.1
        top_p:
          - 0.95
      repeats: 1
